<div>
  <div class="flex absolute top-3 right-3">
    {% for language in languages %}
    <a href="javascript:;" @click="setLang('{{ language }}')">
      <img
        src="assets/images/languages/{{ language }}.webp"
        class="h-5 aspect-auto border-b-2 transition-all m-2"
        :class="lang == '{{ language }}' ? 'border-blue-600' : 'border-transparent'"
      />
    </a>
    {% endfor %}
  </div>
</div>
